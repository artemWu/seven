name: REG.RU deploy (dry-run)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Do not let two builds compare/upload against the same FTP state at once.
concurrency:
  group: regru-production
  cancel-in-progress: false

jobs:
  build-and-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit --pretty false

      - name: Build production static site
        env:
          SITE_TARGET: production
          NEXT_PUBLIC_SITE_TARGET: production
        run: pnpm build

      - name: Normalize HTML routes for Apache
        run: |
          set -euo pipefail
          # vinext exports non-root routes as route.html with trailingSlash=false.
          # Move only HTML route documents into DirectoryIndex locations; keep
          # 404.html and the root index.html unchanged.
          while IFS= read -r -d '' file; do
            case "$file" in
              dist/client/index.html|dist/client/404.html) continue ;;
            esac
            target="${file%.html}/index.html"
            mkdir -p "$(dirname "$target")"
            mv "$file" "$target"
          done < <(find dist/client -type f -name '*.html' -print0)

      - name: Verify static output and SEO files
        run: |
          echo "Static output: dist/client/"
          find dist/client -type f -print | sort
          test -d dist/client || { echo "Missing dist/client/"; exit 1; }
          for file in \
            dist/client/index.html \
            dist/client/uslugi/index.html \
            dist/client/robots.txt \
            dist/client/sitemap.xml \
            dist/client/_redirects \
            dist/client/uslugi/mujskie-strigki/index.html \
            dist/client/uslugi/strigka-borody/index.html \
            dist/client/uslugi/dopolnitelnye-uslugi/index.html \
            dist/client/uslugi/mujskie-strigki-lysye/index.html; do
            test -f "$file" || { echo "Missing expected file: $file"; exit 1; }
          done
          test ! -e dist/client/server.js
          test ! -e dist/client/wrangler.json

      # This connects using explicit FTPS and strict certificate validation,
      # but dry-run guarantees that no remote file is changed.
      - name: Preview REG.RU changes over explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: server207.hosting.reg.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/client/
          server-dir: ./
          dry-run: true
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.htaccess
            .htaccess
            seven-new.zip
            **/seven-new.zip
            .well-known/**
            cgi-bin/**
            logs/**
            .ftp-deploy-sync-state.json
